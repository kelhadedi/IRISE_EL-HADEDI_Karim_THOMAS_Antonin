<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tregrom Meteo - Expérience Poétique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay">
        <header>
            <div id="date-display">--</div>
            <h1 id="location-title">PLAGE DE TRÉGROM</h1>
        </header>

        <main>
    <div id="center-group">
        <div id="poem-btn" onclick="afficherPoeme()">UN PEU DE POÉSIE...</div>
        <div id="temp-display">--°</div>
        <div id="feels-like">RESSENTI : --°</div>
    </div>
</main>

        <footer>
            <div id="detailed-info">
                <div class="info-block">
                    <span id="wind-speed">-- KM/H</span>
                    <span id="wind-dir">VENT --</span>
                </div>
                <div class="info-block">
                    <span id="desc-display">--</span>
                    <span id="cloud-cov">COUVERTURE : --%</span>
                </div>
            </div>
            <div class="controls">
                <button onclick="chargerDataSpecifique('2026-01-01', '02:00')">HIVER</button>
                <button onclick="chargerDataSpecifique('2026-01-20', '14:00')">ORAGE</button>
                <button onclick="chargerDataSpecifique('2025-08-25', '18:00')">ÉTÉ</button>
            </div>
        </footer>
    </div>

    <div id="poem-box" onclick="fermerPoeme()">
        <p id="poem-text"></p>
        <span class="close-hint">CLIQUEZ POUR FERMER</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
